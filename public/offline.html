<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#0f766e">
        <title>DROMIS Offline</title>
        <style>
            :root {
                color-scheme: light;
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            body {
                align-items: center;
                background:
                    radial-gradient(circle at top left, rgba(20, 184, 166, .22), transparent 32rem),
                    linear-gradient(135deg, #f8fafc 0%, #e0f2fe 100%);
                color: #0f172a;
                display: flex;
                margin: 0;
                min-height: 100vh;
                padding: 1.5rem;
            }

            main {
                background: rgba(255, 255, 255, .92);
                border: 1px solid rgba(15, 118, 110, .18);
                border-radius: 1.5rem;
                box-shadow: 0 24px 70px rgba(15, 23, 42, .14);
                margin: auto;
                max-width: 34rem;
                padding: 2rem;
            }

            img {
                height: 4.5rem;
                width: 4.5rem;
            }

            .eyebrow {
                color: #0f766e;
                font-size: .78rem;
                font-weight: 900;
                letter-spacing: .08em;
                margin-top: 1.25rem;
                text-transform: uppercase;
            }

            h1 {
                font-size: clamp(1.75rem, 7vw, 2.5rem);
                line-height: 1.05;
                margin: .35rem 0 .75rem;
            }

            p {
                color: #475569;
                font-size: 1rem;
                line-height: 1.65;
                margin: 0;
            }

            button {
                background: #0f766e;
                border: 0;
                border-radius: .85rem;
                color: white;
                cursor: pointer;
                font: inherit;
                font-weight: 800;
                margin-top: 1.5rem;
                padding: .85rem 1.15rem;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/images/drmd-cir-logo.png" alt="DROMIS">
            <div class="eyebrow">DROMIS Progressive Web App</div>
            <h1>You are offline</h1>
            <p>
                DROMIS could not reach the server right now. Please check your internet connection, then try again.
                Saved pages and static assets may still open once they have been cached by the app.
            </p>
            <button type="button" onclick="window.location.reload()">Try again</button>
        </main>
    </body>
</html>
